id = "refinedtypes"
name = "Refined Types"
version = "0.1.0"
description = """An add-on for Refined Storage that stores what Refined Storage does not: FE, Source and
Souls. Storage blocks add their tier's capacity to the network, storage disks carry their amount in
the item and live in the network's disk drives, and the Network Energizer keeps the network supplied
from the energy storage. Scoped to that storage: the typed grid, exporters, importers, external
storage, autocrafting, the storage screens and the recipes are the port's gap list, not this
version."""
authors = ["Starforcraft", "AdLf0208"]
license = "MIT"
homepage = "https://github.com/AdLf0208/refined_types"
issues = "https://github.com/starforcraft/Refined-Types/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the 31 blocks
# and the 88 items this package declares.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
